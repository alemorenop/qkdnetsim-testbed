# "Key relay" scenario (Alice - Relay - Bob, no direct Alice-Bob link),
# seven persistent QKD/KMS containers. CORE creates the two application
# endpoints and their classical Alice-Bob network.
#
# Usage:
#   docker compose -f docker/docker-compose.key-relay.yml up -d
#
# "name" set explicitly so this does not share a project with
# docker-compose.yml (see the comment there for why it's needed).
name: qkdnetsim-key-relay

networks:
  net_qkd_alice_relay:   # PP Alice <-> PP Relay-A (sifting)
    ipam:
      config:
        - subnet: 192.168.111.0/24
          gateway: 192.168.111.254
  net_alice_pp_kms:   # PP Alice <-> KMS Alice
    ipam:
      config:
        - subnet: 192.168.112.0/24
          gateway: 192.168.112.254
  net_relay_a_pp_kms:   # PP Relay-A <-> KMS Trusted (Alice side)
    ipam:
      config:
        - subnet: 192.168.113.0/24
          gateway: 192.168.113.254
  net_qkd_relay_bob:   # PP Relay-B <-> PP Bob (sifting)
    ipam:
      config:
        - subnet: 192.168.114.0/24
          gateway: 192.168.114.254
  net_relay_b_pp_kms:   # PP Relay-B <-> KMS Trusted (Bob side)
    ipam:
      config:
        - subnet: 192.168.115.0/24
          gateway: 192.168.115.254
  net_bob_pp_kms:   # PP Bob <-> KMS Bob
    ipam:
      config:
        - subnet: 192.168.116.0/24
          gateway: 192.168.116.254
  net_kms_alice_trusted:   # KMS Alice <-> KMS Trusted
    ipam:
      config:
        - subnet: 192.168.117.0/24
          gateway: 192.168.117.254
  net_kms_trusted_bob:   # KMS Trusted <-> KMS Bob
    ipam:
      config:
        - subnet: 192.168.118.0/24
          gateway: 192.168.118.254
  net_alice_kms_app:   # KMS Alice <-> Alice VPN endpoint (ETSI 004/014)
    ipam:
      config:
        - subnet: 192.168.119.0/24
          gateway: 192.168.119.254
  net_bob_kms_app:   # KMS Bob <-> Bob VPN endpoint (ETSI 004/014)
    ipam:
      config:
        - subnet: 192.168.120.0/24
          gateway: 192.168.120.254

services:

  pp_alice:
    image: qkdnetsim-testbed:latest
    container_name: qkd-relay-pp-alice
    hostname: relay-pp-alice
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      NETWORK_SETTLE_MS: "6000"
      QKD_FIBER_LENGTH_KM: "${QKD_ALICE_RELAY_FIBER_LENGTH_KM:-85}"
      QKD_FIBER_ATTENUATION_DB_PER_KM: "${QKD_ALICE_RELAY_ATTENUATION_DB_PER_KM:-0.2417}"
      QKD_ZERO_LOSS_KEY_RATE_BPS: "${QKD_ZERO_LOSS_KEY_RATE_BPS:-17094000}"
      DEV_MAP_SIFT: "192.168.111"
      DEV_MAP_KMS: "192.168.112"
    networks:
      net_qkd_alice_relay: { ipv4_address: 192.168.111.1 }
      net_alice_pp_kms: { ipv4_address: 192.168.112.1 }
    # Waits for KMS Alice to confirm (via ListenReady/healthcheck) that it is
    # already in Listen() before starting. The model's own connection retry
    # also covers restarts or transient losses afterward.
    depends_on:
      pp_relay_a:
        condition: service_healthy
      kms_alice:
        condition: service_healthy
    command: ["/opt/ns-3-dev/build/contrib/qkdnetsim/examples/ns3.46-relay_pp_alice-default"]

  pp_relay_a:
    image: qkdnetsim-testbed:latest
    container_name: qkd-relay-pp-a
    hostname: relay-pp-a
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      NETWORK_SETTLE_MS: "6000"
      QKD_FIBER_LENGTH_KM: "${QKD_ALICE_RELAY_FIBER_LENGTH_KM:-85}"
      QKD_FIBER_ATTENUATION_DB_PER_KM: "${QKD_ALICE_RELAY_ATTENUATION_DB_PER_KM:-0.2417}"
      QKD_ZERO_LOSS_KEY_RATE_BPS: "${QKD_ZERO_LOSS_KEY_RATE_BPS:-17094000}"
      DEV_MAP_SIFT: "192.168.111"
      DEV_MAP_KMS: "192.168.113"
    networks:
      net_qkd_alice_relay: { ipv4_address: 192.168.111.2 }
      net_relay_a_pp_kms: { ipv4_address: 192.168.113.2 }
    depends_on:
      kms_trusted:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'Post-processing Relay-A listening' /tmp/qkdnetsim.log"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    command: ["/opt/ns-3-dev/build/contrib/qkdnetsim/examples/ns3.46-relay_pp_relay_a-default"]

  pp_relay_b:
    image: qkdnetsim-testbed:latest
    container_name: qkd-relay-pp-b
    hostname: relay-pp-b
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      NETWORK_SETTLE_MS: "6000"
      QKD_FIBER_LENGTH_KM: "${QKD_RELAY_BOB_FIBER_LENGTH_KM:-100}"
      QKD_FIBER_ATTENUATION_DB_PER_KM: "${QKD_RELAY_BOB_ATTENUATION_DB_PER_KM:-0.2303}"
      QKD_ZERO_LOSS_KEY_RATE_BPS: "${QKD_ZERO_LOSS_KEY_RATE_BPS:-17094000}"
      DEV_MAP_SIFT: "192.168.114"
      DEV_MAP_KMS: "192.168.115"
    networks:
      net_qkd_relay_bob: { ipv4_address: 192.168.114.3 }
      net_relay_b_pp_kms: { ipv4_address: 192.168.115.3 }
    depends_on:
      pp_bob:
        condition: service_healthy
      kms_trusted:
        condition: service_healthy
    command: ["/opt/ns-3-dev/build/contrib/qkdnetsim/examples/ns3.46-relay_pp_relay_b-default"]

  pp_bob:
    image: qkdnetsim-testbed:latest
    container_name: qkd-relay-pp-bob
    hostname: relay-pp-bob
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      NETWORK_SETTLE_MS: "6000"
      QKD_FIBER_LENGTH_KM: "${QKD_RELAY_BOB_FIBER_LENGTH_KM:-100}"
      QKD_FIBER_ATTENUATION_DB_PER_KM: "${QKD_RELAY_BOB_ATTENUATION_DB_PER_KM:-0.2303}"
      QKD_ZERO_LOSS_KEY_RATE_BPS: "${QKD_ZERO_LOSS_KEY_RATE_BPS:-17094000}"
      DEV_MAP_SIFT: "192.168.114"
      DEV_MAP_KMS: "192.168.116"
    networks:
      net_qkd_relay_bob: { ipv4_address: 192.168.114.4 }
      net_bob_pp_kms: { ipv4_address: 192.168.116.4 }
    depends_on:
      kms_bob:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'Post-processing Bob listening' /tmp/qkdnetsim.log"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    command: ["/opt/ns-3-dev/build/contrib/qkdnetsim/examples/ns3.46-relay_pp_bob-default"]

  kms_alice:
    image: qkdnetsim-testbed:latest
    container_name: qkd-relay-kms-alice
    hostname: relay-kms-alice
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      DEV_MAP_PP: "192.168.112"
      DEV_MAP_KMS: "192.168.117"
      DEV_MAP_ETSI: "192.168.119"
    networks:
      net_alice_pp_kms: { ipv4_address: 192.168.112.5 }
      net_kms_alice_trusted: { ipv4_address: 192.168.117.5 }
      net_alice_kms_app: { ipv4_address: 192.168.119.5 }
    depends_on:
      kms_trusted:
        condition: service_healthy
    # "listening" = marker printed via the ListenReady trace (see
    # qkd-key-manager-system-application.{h,cc}) once m_sinkSocket and
    # m_sinkSocketKMS are already in Listen(). entrypoint.sh mirrors all
    # stdout to /tmp/qkdnetsim.log so this healthcheck (which runs INSIDE the
    # container) can see it -- "docker logs" is not visible from in here.
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'KMS Alice listening' /tmp/qkdnetsim.log"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    command: ["/opt/ns-3-dev/build/contrib/qkdnetsim/examples/ns3.46-relay_kms_alice-default"]

  kms_trusted:
    image: qkdnetsim-testbed:latest
    container_name: qkd-relay-kms-trusted
    hostname: relay-kms-trusted
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      DEV_MAP_PPA: "192.168.113"
      DEV_MAP_PPB: "192.168.115"
      DEV_MAP_KMSA: "192.168.117"
      DEV_MAP_KMSB: "192.168.118"
    networks:
      net_relay_a_pp_kms: { ipv4_address: 192.168.113.6 }
      net_relay_b_pp_kms: { ipv4_address: 192.168.115.6 }
      net_kms_alice_trusted: { ipv4_address: 192.168.117.6 }
      net_kms_trusted_bob: { ipv4_address: 192.168.118.6 }
    depends_on:
      kms_bob:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'KMS Relay listening' /tmp/qkdnetsim.log"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    command: ["/opt/ns-3-dev/build/contrib/qkdnetsim/examples/ns3.46-relay_kms_trusted-default"]

  kms_bob:
    image: qkdnetsim-testbed:latest
    container_name: qkd-relay-kms-bob
    hostname: relay-kms-bob
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      DEV_MAP_PP: "192.168.116"
      DEV_MAP_KMS: "192.168.118"
      DEV_MAP_ETSI: "192.168.120"
    networks:
      net_bob_pp_kms: { ipv4_address: 192.168.116.7 }
      net_kms_trusted_bob: { ipv4_address: 192.168.118.7 }
      net_bob_kms_app: { ipv4_address: 192.168.120.7 }
    # Root of the depends_on chain (nobody else waits on anyone before
    # reaching here) -- no dependencies of its own.
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'KMS Bob listening' /tmp/qkdnetsim.log"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    command: ["/opt/ns-3-dev/build/contrib/qkdnetsim/examples/ns3.46-relay_kms_bob-default"]
