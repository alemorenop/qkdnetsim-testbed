# Scenario 3: point-to-point QKDNetSim with native strongSwan consumers.
# Select the QKD application interface with QKD_INTERFACE=004 or 014
# (ETSI 004 is used by default).
#
# This is intentionally a standalone Compose project.  Reusing the base file
# as an override kept its ETSI 014 service names and, more importantly, merged
# HOST5's old "wait for healthy HOST6" dependency into the VPN scenario.  That
# created a deadlock because the VPN health check requires HOST5 to initiate
# IKE.  HOST1-HOST4 are extended from the base scenario; only HOST5/HOST6 are
# replaced.
#
# Usage:
#   docker compose -f docker/docker-compose.vpn.yml up -d --build
name: qkdnetsim-point-to-point-vpn

networks:
  net_h1_h2:
    ipam:
      config:
        - subnet: 192.168.11.0/24
          gateway: 192.168.11.254
  net_h1_h3:
    ipam:
      config:
        - subnet: 192.168.13.0/24
          gateway: 192.168.13.254
  net_h2_h4:
    ipam:
      config:
        - subnet: 192.168.24.0/24
          gateway: 192.168.24.254
  net_h3_h4:
    ipam:
      config:
        - subnet: 192.168.34.0/24
          gateway: 192.168.34.254
  net_h3_h5:
    ipam:
      config:
        - subnet: 192.168.35.0/24
          gateway: 192.168.35.254
  net_h4_h6:
    ipam:
      config:
        - subnet: 192.168.46.0/24
          gateway: 192.168.46.254
  net_h5_h6:
    ipam:
      config:
        - subnet: 192.168.56.0/24
          gateway: 192.168.56.254

services:
  host1_pp_alice:
    extends:
      file: docker-compose.yml
      service: host1_pp_alice
    container_name: qkd-vpn-host1

  host2_pp_bob:
    extends:
      file: docker-compose.yml
      service: host2_pp_bob
    container_name: qkd-vpn-host2

  host3_kms_alice:
    extends:
      file: docker-compose.yml
      service: host3_kms_alice
    container_name: qkd-vpn-host3

  host4_kms_bob:
    extends:
      file: docker-compose.yml
      service: host4_kms_bob
    container_name: qkd-vpn-host4

  host6_vpn_bob:
    build:
      context: ..
      dockerfile: docker/vpn/Dockerfile.vpn
    image: qkdnetsim-vpn-endpoint:latest
    container_name: qkd-vpn-host6
    hostname: host6-vpn-bob
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      VPN_ROLE: "bob"
      QKD_INTERFACE: "${QKD_INTERFACE:-004}"
      OWN_IP: "192.168.56.6"
      PEER_IP: "192.168.56.5"
      KMS_IP: "192.168.46.4"
      OWN_APP_ID: "bbbbbbbb-0000-0000-0000-000000000002"
      PEER_APP_ID: "bbbbbbbb-0000-0000-0000-000000000001"
      CONTROL_PORT: "9090"
      KEY_CHUNK_SIZE_BITS: "256"
      REKEY_INTERVAL_S: "60"
    networks:
      net_h5_h6: { ipv4_address: 192.168.56.6 }
      net_h4_h6: { ipv4_address: 192.168.46.6 }
    depends_on:
      host4_kms_bob:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import json; s=json.load(open('/run/qkd-vpn/state.json')); raise SystemExit(0 if s.get('tunnel_up') else 1)\" && ipsec statusall | grep -q 'ESTABLISHED'"]
      interval: 3s
      timeout: 3s
      retries: 80
      start_period: 5s

  host5_vpn_alice:
    image: qkdnetsim-vpn-endpoint:latest
    container_name: qkd-vpn-host5
    hostname: host5-vpn-alice
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      VPN_ROLE: "alice"
      QKD_INTERFACE: "${QKD_INTERFACE:-004}"
      OWN_IP: "192.168.56.5"
      PEER_IP: "192.168.56.6"
      KMS_IP: "192.168.35.3"
      OWN_APP_ID: "bbbbbbbb-0000-0000-0000-000000000001"
      PEER_APP_ID: "bbbbbbbb-0000-0000-0000-000000000002"
      CONTROL_PORT: "9090"
      KEY_CHUNK_SIZE_BITS: "256"
      REKEY_INTERVAL_S: "60"
    networks:
      net_h5_h6: { ipv4_address: 192.168.56.5 }
      net_h3_h5: { ipv4_address: 192.168.35.5 }
    depends_on:
      host3_kms_alice:
        condition: service_healthy
      host6_vpn_bob:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import json; s=json.load(open('/run/qkd-vpn/state.json')); raise SystemExit(0 if s.get('tunnel_up') else 1)\" && ipsec statusall | grep -q 'ESTABLISHED'"]
      interval: 3s
      timeout: 3s
      retries: 80
      start_period: 5s
