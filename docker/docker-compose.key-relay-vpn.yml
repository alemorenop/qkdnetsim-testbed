# Scenario 4: key relay (Alice - trusted relay - Bob) with native
# strongSwan consumers.  H1-H7 are extended unchanged from the
# synthetic key-relay scenario. H8/H9 use the multi-hop ETSI GS QKD
# 004 implementation by default; set QKD_INTERFACE=014 to compare it with
# the key-oriented interface over the same trusted-node topology.
#
# Usage:
#   docker compose -f docker/docker-compose.key-relay-vpn.yml up -d --build
name: qkdnetsim-key-relay-vpn

networks:
  net_qkd_alice_relay:
    ipam:
      config:
        - subnet: 192.168.111.0/24
          gateway: 192.168.111.254
  net_alice_pp_kms:
    ipam:
      config:
        - subnet: 192.168.112.0/24
          gateway: 192.168.112.254
  net_relay_a_pp_kms:
    ipam:
      config:
        - subnet: 192.168.113.0/24
          gateway: 192.168.113.254
  net_qkd_relay_bob:
    ipam:
      config:
        - subnet: 192.168.114.0/24
          gateway: 192.168.114.254
  net_relay_b_pp_kms:
    ipam:
      config:
        - subnet: 192.168.115.0/24
          gateway: 192.168.115.254
  net_bob_pp_kms:
    ipam:
      config:
        - subnet: 192.168.116.0/24
          gateway: 192.168.116.254
  net_kms_alice_trusted:
    ipam:
      config:
        - subnet: 192.168.117.0/24
          gateway: 192.168.117.254
  net_kms_trusted_bob:
    ipam:
      config:
        - subnet: 192.168.118.0/24
          gateway: 192.168.118.254
  net_alice_kms_app:
    ipam:
      config:
        - subnet: 192.168.119.0/24
          gateway: 192.168.119.254
  net_bob_kms_app:
    ipam:
      config:
        - subnet: 192.168.120.0/24
          gateway: 192.168.120.254
  net_app_data:
    ipam:
      config:
        - subnet: 192.168.121.0/24
          gateway: 192.168.121.254

services:
  pp_alice:
    extends:
      file: docker-compose.key-relay.yml
      service: pp_alice
    container_name: qkd-relay-vpn-pp-alice

  pp_relay_a:
    extends:
      file: docker-compose.key-relay.yml
      service: pp_relay_a
    container_name: qkd-relay-vpn-pp-a

  pp_relay_b:
    extends:
      file: docker-compose.key-relay.yml
      service: pp_relay_b
    container_name: qkd-relay-vpn-pp-b

  pp_bob:
    extends:
      file: docker-compose.key-relay.yml
      service: pp_bob
    container_name: qkd-relay-vpn-pp-bob

  kms_alice:
    extends:
      file: docker-compose.key-relay.yml
      service: kms_alice
    container_name: qkd-relay-vpn-kms-alice

  kms_trusted:
    extends:
      file: docker-compose.key-relay.yml
      service: kms_trusted
    container_name: qkd-relay-vpn-kms-trusted

  kms_bob:
    extends:
      file: docker-compose.key-relay.yml
      service: kms_bob
    container_name: qkd-relay-vpn-kms-bob

  vpn_bob:
    build:
      context: ..
      dockerfile: docker/vpn/Dockerfile.vpn
    image: qkdnetsim-vpn-endpoint:latest
    container_name: qkd-relay-vpn-bob
    hostname: relay-vpn-bob
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      VPN_ROLE: "bob"
      QKD_INTERFACE: "${QKD_INTERFACE:-004}"
      OWN_IP: "192.168.121.9"
      PEER_IP: "192.168.121.8"
      KMS_IP: "192.168.120.7"
      OWN_APP_ID: "eeeeeeee-0000-0000-0000-000000000002"
      PEER_APP_ID: "eeeeeeee-0000-0000-0000-000000000001"
      CONTROL_PORT: "9090"
      KEY_CHUNK_SIZE_BITS: "256"
      REKEY_INTERVAL_S: "60"
    networks:
      net_bob_kms_app: { ipv4_address: 192.168.120.9 }
      net_app_data: { ipv4_address: 192.168.121.9 }
    depends_on:
      kms_bob:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import json; s=json.load(open('/run/qkd-vpn/state.json')); raise SystemExit(0 if s.get('tunnel_up') else 1)\" && ipsec statusall | grep -q 'ESTABLISHED'"]
      interval: 3s
      timeout: 3s
      retries: 120
      start_period: 5s

  vpn_alice:
    image: qkdnetsim-vpn-endpoint:latest
    container_name: qkd-relay-vpn-alice
    hostname: relay-vpn-alice
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      VPN_ROLE: "alice"
      QKD_INTERFACE: "${QKD_INTERFACE:-004}"
      OWN_IP: "192.168.121.8"
      PEER_IP: "192.168.121.9"
      KMS_IP: "192.168.119.5"
      OWN_APP_ID: "eeeeeeee-0000-0000-0000-000000000001"
      PEER_APP_ID: "eeeeeeee-0000-0000-0000-000000000002"
      CONTROL_PORT: "9090"
      KEY_CHUNK_SIZE_BITS: "256"
      REKEY_INTERVAL_S: "60"
    networks:
      net_alice_kms_app: { ipv4_address: 192.168.119.8 }
      net_app_data: { ipv4_address: 192.168.121.8 }
    depends_on:
      kms_alice:
        condition: service_healthy
      vpn_bob:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import json; s=json.load(open('/run/qkd-vpn/state.json')); raise SystemExit(0 if s.get('tunnel_up') else 1)\" && ipsec statusall | grep -q 'ESTABLISHED'"]
      interval: 3s
      timeout: 3s
      retries: 120
      start_period: 5s
