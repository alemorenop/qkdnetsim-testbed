# Point-to-point scenario (Fig. 3 from the paper, adapted to containers), 6
# containers, each with an independent ns-3 process. The IPs of
# each network match the defaults already written in the point-to-point/
# .cc files, so there is no need to pass --myIpXXX on the command line.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up
#
# "name" sets the project name explicitly: without this, Docker Compose
# uses the folder name ("docker") as the default project, and since
# docker-compose.key-relay.yml lives in the same folder, both would end up
# merged into the same project (with a real risk that an "up" of one
# recreates/removes containers of the other if they share a service key).
name: qkdnetsim-fig3-6host

# Note on DEV_MAP_*: Docker does not guarantee that the order in which a
# service's networks are attached translates into the same eth0/eth1/eth2
# inside the container between one "up" and the next. entrypoint.sh detects
# at startup, for each interface, the IP Docker assigned it, compares it
# against these variables (/24 prefix), and passes the correct --devXXX
# flag to ns-3 on its own, so the real network->interface mapping does not
# matter.

# All networks fix their gateway at ".254", outside the .1-.6 range used by
# the containers, so Docker does not reserve by default an IP (".1") that
# has already been assigned to one of the containers (that caused "Address
# already in use").
networks:
  net_qkd:   # H1 <-> H2  (sifting, post-processing Alice-Bob)
    ipam:
      config:
        - subnet: 192.168.11.0/24
          gateway: 192.168.11.254
  net_alice_pp_kms:   # H1 <-> H3  (post-processing Alice -> KMS Alice)
    ipam:
      config:
        - subnet: 192.168.13.0/24
          gateway: 192.168.13.254
  net_bob_pp_kms:   # H2 <-> H4  (post-processing Bob -> KMS Bob)
    ipam:
      config:
        - subnet: 192.168.24.0/24
          gateway: 192.168.24.254
  net_kms_peer:   # H3 <-> H4  (KMS Alice <-> KMS Bob, relay/transform_keys)
    ipam:
      config:
        - subnet: 192.168.34.0/24
          gateway: 192.168.34.254
  net_alice_kms_app:   # H3 <-> H5  (KMS Alice -> ETSI014 Alice, GET_KEY)
    ipam:
      config:
        - subnet: 192.168.35.0/24
          gateway: 192.168.35.254
  net_bob_kms_app:   # H4 <-> H6  (KMS Bob -> ETSI014 Bob, GET_KEY)
    ipam:
      config:
        - subnet: 192.168.46.0/24
          gateway: 192.168.46.254
  net_app_data:   # H5 <-> H6  (trafico cifrado ETSI014 Alice-Bob)
    ipam:
      config:
        - subnet: 192.168.56.0/24
          gateway: 192.168.56.254

services:

  pp_alice:
    image: qkdnetsim-6vm-emulation:latest
    container_name: qkd-p2p-pp-alice
    hostname: p2p-pp-alice
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      NETWORK_SETTLE_MS: "6000"
      QKD_FIBER_LENGTH_KM: "${QKD_FIBER_LENGTH_KM:-85}"
      QKD_FIBER_ATTENUATION_DB_PER_KM: "${QKD_FIBER_ATTENUATION_DB_PER_KM:-0.2417}"
      QKD_ZERO_LOSS_KEY_RATE_BPS: "${QKD_ZERO_LOSS_KEY_RATE_BPS:-17094000}"
      DEV_MAP_SIFT: "192.168.11"
      DEV_MAP_KMS: "192.168.13"
    networks:
      net_qkd: { ipv4_address: 192.168.11.1 }
      net_alice_pp_kms: { ipv4_address: 192.168.13.1 }
    depends_on:
      pp_bob:
        condition: service_healthy
      kms_alice:
        condition: service_healthy
    command: ["/opt/ns-3-dev/build/contrib/qkdnetsim/examples/ns3.46-p2p_pp_alice-default"]

  pp_bob:
    image: qkdnetsim-6vm-emulation:latest
    container_name: qkd-p2p-pp-bob
    hostname: p2p-pp-bob
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      NETWORK_SETTLE_MS: "6000"
      QKD_FIBER_LENGTH_KM: "${QKD_FIBER_LENGTH_KM:-85}"
      QKD_FIBER_ATTENUATION_DB_PER_KM: "${QKD_FIBER_ATTENUATION_DB_PER_KM:-0.2417}"
      QKD_ZERO_LOSS_KEY_RATE_BPS: "${QKD_ZERO_LOSS_KEY_RATE_BPS:-17094000}"
      DEV_MAP_SIFT: "192.168.11"
      DEV_MAP_KMS: "192.168.24"
    networks:
      net_qkd: { ipv4_address: 192.168.11.2 }
      net_bob_pp_kms: { ipv4_address: 192.168.24.2 }
    depends_on:
      kms_bob:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'Post-processing Bob listening' /tmp/qkdnetsim.log"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    command: ["/opt/ns-3-dev/build/contrib/qkdnetsim/examples/ns3.46-p2p_pp_bob-default"]

  kms_alice:
    image: qkdnetsim-6vm-emulation:latest
    container_name: qkd-p2p-kms-alice
    hostname: p2p-kms-alice
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      DEV_MAP_PP: "192.168.13"
      DEV_MAP_KMS: "192.168.34"
      DEV_MAP_ETSI: "192.168.35"
    networks:
      net_alice_pp_kms: { ipv4_address: 192.168.13.3 }
      net_kms_peer: { ipv4_address: 192.168.34.3 }
      net_alice_kms_app: { ipv4_address: 192.168.35.3 }
    depends_on:
      kms_bob:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'KMS Alice listening' /tmp/qkdnetsim.log"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    command: ["/opt/ns-3-dev/build/contrib/qkdnetsim/examples/ns3.46-p2p_kms_alice-default"]

  kms_bob:
    image: qkdnetsim-6vm-emulation:latest
    container_name: qkd-p2p-kms-bob
    hostname: p2p-kms-bob
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      DEV_MAP_PP: "192.168.24"
      DEV_MAP_KMS: "192.168.34"
      DEV_MAP_ETSI: "192.168.46"
    networks:
      net_bob_pp_kms: { ipv4_address: 192.168.24.4 }
      net_kms_peer: { ipv4_address: 192.168.34.4 }
      net_bob_kms_app: { ipv4_address: 192.168.46.4 }
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'KMS Bob listening' /tmp/qkdnetsim.log"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    command: ["/opt/ns-3-dev/build/contrib/qkdnetsim/examples/ns3.46-p2p_kms_bob-default"]

  etsi014_alice:
    image: qkdnetsim-6vm-emulation:latest
    container_name: qkd-p2p-etsi014-alice
    hostname: p2p-etsi014-alice
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      DEV_MAP_DATA: "192.168.56"
      DEV_MAP_KMS: "192.168.35"
    networks:
      net_app_data: { ipv4_address: 192.168.56.5 }
      net_alice_kms_app: { ipv4_address: 192.168.35.5 }
    depends_on:
      kms_alice:
        condition: service_healthy
      etsi014_bob:
        condition: service_healthy
    command: ["/opt/ns-3-dev/build/contrib/qkdnetsim/examples/ns3.46-p2p_etsi014_alice-default", "--appStartTime=20"]

  etsi014_bob:
    image: qkdnetsim-6vm-emulation:latest
    container_name: qkd-p2p-etsi014-bob
    hostname: p2p-etsi014-bob
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      DEV_MAP_DATA: "192.168.56"
      DEV_MAP_KMS: "192.168.46"
    networks:
      net_app_data: { ipv4_address: 192.168.56.6 }
      net_bob_kms_app: { ipv4_address: 192.168.46.6 }
    depends_on:
      kms_bob:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'Listening for application traffic' /tmp/qkdnetsim.log"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 20s
    command: ["/opt/ns-3-dev/build/contrib/qkdnetsim/examples/ns3.46-p2p_etsi014_bob-default", "--appStartTime=20"]
