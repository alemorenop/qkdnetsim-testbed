# Scenario 3: point-to-point QKD/KMS infrastructure for the strongSwan
# consumer. CORE always creates Alice and Bob and their classical network.
#
# Usage:
#   docker compose -f docker/docker-compose.vpn.yml up -d
name: qkdnetsim-point-to-point-vpn

networks:
  net_qkd:
    ipam:
      config:
        - subnet: 192.168.11.0/24
          gateway: 192.168.11.254
  net_alice_pp_kms:
    ipam:
      config:
        - subnet: 192.168.13.0/24
          gateway: 192.168.13.254
  net_bob_pp_kms:
    ipam:
      config:
        - subnet: 192.168.24.0/24
          gateway: 192.168.24.254
  net_kms_peer:
    ipam:
      config:
        - subnet: 192.168.34.0/24
          gateway: 192.168.34.254
  net_alice_kms_app:
    ipam:
      config:
        - subnet: 192.168.35.0/24
          gateway: 192.168.35.254
  net_bob_kms_app:
    ipam:
      config:
        - subnet: 192.168.46.0/24
          gateway: 192.168.46.254

services:
  pp_alice:
    extends:
      file: docker-compose.yml
      service: pp_alice
    container_name: qkd-p2p-vpn-pp-alice

  pp_bob:
    extends:
      file: docker-compose.yml
      service: pp_bob
    container_name: qkd-p2p-vpn-pp-bob

  kms_alice:
    extends:
      file: docker-compose.yml
      service: kms_alice
    container_name: qkd-p2p-vpn-kms-alice

  kms_bob:
    extends:
      file: docker-compose.yml
      service: kms_bob
    container_name: qkd-p2p-vpn-kms-bob
